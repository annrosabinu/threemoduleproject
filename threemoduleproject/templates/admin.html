<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @media(min-width:576px) {    
            .vertical-nav {
                position: fixed;
                top: 56px;
                left: 0;
                width: 200px;
                height: 100%;
                background-color: #f8f8f8;
                overflow-y: auto;
                padding-top: 40px
            }
            li{
                border-bottom: 2px solid black;
                
            }
            li:hover{
                background-color: blueviolet;
            }
            .content{
               margin-left:220px;
               margin-top:60px;
               overflow-x: hidden;
            }
            .align{
              margin-left: 280px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-primary">
        <a class="navbar-brand" href="#">Welcome admin</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                      <span class="navbar-toggler-icon"></span>
                  </button>
      
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto flex-column vertical-nav bg-primary ">
            <li class="nav-item">
              <a class="nav-link text-dark" href="{% url 'adminhome' %}">Admin Menu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="{% url 'approvedisapprove' %}">Approve And Disapprove<span class="badge badge-warning">{{count}}</span></a>
            </li>
          </ul>
          
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
            </li>
          </ul>
      
        </div>
    </nav>
        <div class="content">
          <div class="row">
            <!-- Total Teachers -->
            <div class="col-md-4">
                <div class="card border-primary shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary">Total Teachers</h5>
                        <h1 class="display-4">{{ total_teachers }}</h1>
                    </div>
                </div>
            </div>
    
            <!-- Total Students -->
            <div class="col-md-4">
                <div class="card border-success shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success">Total Students</h5>
                        <h1 class="display-4">{{ total_students }}</h1>
                    </div>
                </div>
            </div>
    
            <!-- Pending Approvals -->
            <div class="col-md-4">
                <div class="card border-warning shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title text-warning">Pending Approvals</h5>
                        <h1 class="display-4">{{ count }}</h1>
                    </div>
                </div>
            </div>
          </div>
        </div>
     
</body>
</html>
