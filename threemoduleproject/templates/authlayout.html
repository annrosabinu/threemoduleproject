<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @media(min-width:350px)
        {
            body{
                background-image:url('{% static "images/authbg.avif" %}');
                background-repeat:no-repeat;
                background-size: cover;
                height:100vh;
            }
            label{
                margin-top: 10px;
                color: aqua;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-secondary fixed-top navbar-dark">
        <a class="navbar-brand text-warning" href="{% url 'homepage' %}">ABC Tution</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav bg-white ml-auto">
            <a class="nav-link text-primary" href="{% url 'homepage' %}">Home</a>
            <a class="nav-link text-primary" href="{% url 'loginpage' %}">Login</a>
            <a class="nav-link text-primary" href="{% url 'tsignup' %}">Teacher signup</a>
            <a class="nav-link text-primary" href="{% url 'stusignup' %}">Student Signup</a>
          </div>
        </div>
    </nav>
    {% block content %}

    {% endblock %}
</body>
</html>
