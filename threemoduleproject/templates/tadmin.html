<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @media (min-width: 576px) {
            .vertical-nav {
                position: fixed;
                top: 56px;
                left: 0;
                width: 200px;
                height: 100%;
                background-color: #f8f8f8;
                overflow-y: auto;
                padding-top: 30px;
            }
            .vertical-nav li {
                border-bottom: 2px solid black;
            }
            .vertical-nav li:hover {
                background-color: blueviolet;
            }
            .content {
                margin-left: 220px;
                margin-top: 60px;
                overflow-x: hidden;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-secondary">
        <a class="navbar-brand text-white" href="#">Welcome {{ user.username }}</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto flex-column vertical-nav bg-primary">
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'tadmin'%}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'reset' %}">Reset Password</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="content">
        <div class="row">
            <div class="col-md-12 text-center">
                <h2>Welcome, {{ user.username }}</h2>
                <p class="text-muted">Quick access to your teaching tools and resources.</p>
            </div>
        </div>

        <!-- Profile and Logout Cards -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title">Profile</h5>
                        <p class="card-text">Update details.</p>
                        <a href="#" class="btn btn-warning">Edit</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5 class="card-title">Logout</h5>
                        <p class="card-text">Sign out of your account.</p>
                        <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
                        <a href="{% url 'reset' %}" class="btn btn-primary">Reset Password</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
